<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>403 Forbidden</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            text-align: center;
            color: #333;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        img {
            max-width: 200px;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 72px;
            margin: 0;
            color: #555;
        }
        h2 {
            font-size: 24px;
            margin: 0.5rem 0 1.5rem;
            color: #007bff;
        }
        p {
            font-size: 16px;
            margin-bottom: 2rem;
        }
        a.button {
            display: inline-block;
            padding: 0.75rem 1.5rem;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        a.button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{{ url_for('static', filename='img/lock.png') }}" alt="Lock Icon">
        <h1>403</h1>
        <h2>¡ACCESO DENEGADO!</h2>
        <p>Usted no tiene permiso para acceder a esta página.</p>
        <a href="{{ url_for('main.index') }}" class="button">Regresar</a>
    </div>
</body>
</html>
