# docker-compose.yml
services:

  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data

  web:
    build: .
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8090:8090"
    depends_on:
      - db

volumes:
  pgdata:
