# docker-compose.yml
services:

  db:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    volumes: 
      - pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energuate -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - .:/app
    ports:
      - "8090:8090"
    depends_on:
      db: 
        condition: service_healthy

volumes: 
  pgdata: 
